name: Update Screener Data

on:
  schedule:
    - cron: '5 * * * *'   # Toutes les heures à la 5e minute
  workflow_dispatch:       # Pour déclenchement manuel depuis l'onglet Actions

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run data fetcher
        run: python scripts/fetch_all_tickers.py

      - name: Commit and push data file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/latest.parquet
          git commit -m "Auto-update screener data $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push